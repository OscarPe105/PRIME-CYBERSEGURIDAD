<section class="table-card">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>FECHA</th>
          <th>EVENTO</th>
          <th>USUARIO</th>
          <th>DETALLE</th>
        </tr>
      </thead>
      <tbody>
        @for (e of paged; track e.id; let i = $index) {
          <tr>
            <td>{{ start + i }}</td>
            <td>{{ date(e.created_at) }}</td>
            <td>{{ e.event }}</td>
            <td>{{ e.user_id || 'Sin sesión' }}</td>
            <td>{{ e.details }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <prime-pagination [total]="events.length" [page]="page" (pageChange)="page = $event" />
</section>
