<section class="rounded-ui border border-border bg-background p-6">
  <h2 class="text-sm font-semibold uppercase tracking-wide text-muted-foreground">Apariencia</h2>
  <p class="mt-2 text-sm text-muted-foreground">
    Elige la paleta de colores de la interfaz. Se guarda en este navegador y no afecta los datos ni
    el cálculo de PRIME.
  </p>
  <div
    class="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"
    role="radiogroup"
    aria-label="Paleta de colores"
  >
    @for (t of themes; track t.id) {
      <button
        type="button"
        role="radio"
        class="flex items-center gap-3 rounded-ui border bg-background p-3 text-left transition hover:bg-muted"
        [class]="active() === t.id ? 'border-primary ring-2 ring-primary' : 'border-border'"
        [attr.aria-checked]="active() === t.id"
        (click)="choose(t.id)"
      >
        <span
          class="flex h-8 w-14 overflow-hidden rounded-md border border-border"
          aria-hidden="true"
        >
          <span class="flex-1" [style.background]="t.swatch[0]"></span>
          <span class="flex-1" [style.background]="t.swatch[1]"></span>
          <span class="flex-1" [style.background]="t.swatch[2]"></span>
        </span>
        <span class="text-sm font-medium text-foreground">{{ t.label }}</span>
        @if (active() === t.id) {
          <span class="ml-auto text-xs font-semibold text-primary">Activa</span>
        }
      </button>
    }
  </div>
</section>
